options:
  basename: chameleontwist
  target_path: baserom.us.z64
  base_path: .
  compiler: IDO
  find_file_boundaries: True
  header_encoding: ASCII
  platform: n64
  ld_symbol_header_path: include/ld_addrs.h
  ld_script_path: chameleontwist.us.ld
  undefined_funcs_auto_path: undefined_funcs_auto.txt
  symbol_addrs_path: symbol_addrs.txt
  asm_path: asm
  src_path: src
  asset_path: assets
  build_path: build
  gfx_ucode: f3dex
  extensions_path: tools/splat_ext
  # auto_all_sections: [".data", ".rodata", ".bss"]
  migrate_rodata_to_functions : True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  create_undefined_funcs_auto: no
  asm_emit_size_directive: true
  asm_end_label: ""
  asm_nonmatching_label_macro: ""
  asm_data_end_label: ""
  asm_function_alt_macro: ""
  #cache_path: .splache
